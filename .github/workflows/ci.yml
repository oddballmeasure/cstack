name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: L0 lint
        run: node tests/lint/lint.mjs
      - name: Unit tests (hooks, lint, scripts)
        run: node --test 'tests/**/*.test.mjs'
