name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: L0 lint
        run: node tests/lint/lint.mjs
      - name: Unit tests (hooks, lint, scripts)
        run: npm test
      - name: Gate coverage (100% lines and branches)
        run: npm run coverage:gates
      - name: Uncovered branches (only when the coverage bar failed)
        if: failure()
        run: |
          node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=/tmp/gates.lcov $(node -e 'const s=require("./package.json").scripts["coverage:gates"]; console.log((s.match(/--test-coverage-include=\S+/g)||[]).join(" ").replace(/'/g,""))') 'tests/gates/*.test.mjs' > /dev/null 2>&1 || true
          awk -F'[:,]' '/^SF:/{f=$2} /^BRDA:/{ if ($5=="0"||$5=="-") print f":"$2" block "$3" branch "$4 }' /tmp/gates.lcov | sort -u
