name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: L0 lint
        run: node tests/lint/lint.mjs
      - name: Unit tests (hooks, lint, scripts)
        timeout-minutes: 15
        run: npm test
      - name: Gate coverage (100% lines and branches)
        timeout-minutes: 15
        run: npm run coverage:gates
      - name: Uncovered branches (only when the coverage bar failed)
        if: failure()
        timeout-minutes: 15
        run: node tests/lint/uncovered.mjs
