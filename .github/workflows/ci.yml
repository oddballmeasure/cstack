name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: L0 lint
        run: node tests/lint/lint.mjs
      - name: Unit tests (hooks, lint, scripts)
        timeout-minutes: 15
        run: npm test
      # Windows skips the tests that need POSIX signals, chmod or POSIX permission paths, so the bar is set where
      # the whole suite runs.
      - name: Gate coverage (100% lines and branches)
        if: runner.os != 'Windows'
        timeout-minutes: 30
        run: node tests/lint/coverage-bar.mjs
